version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fitness_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: